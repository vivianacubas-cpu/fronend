<!-- ═══════════════════════════════════════════════════════════
     LAYOUT ADMINISTRATIVO — sidebar izquierdo + router-outlet
═══════════════════════════════════════════════════════════ -->
<div class="adm-shell">

  <!-- ════════════════ SIDEBAR LATERAL ════════════════ -->
  <aside class="adm-sidebar">
    <p class="adm-sidebar__label">Área administrativa</p>

    <nav class="adm-sidebar__nav">

      <a routerLink="/fut/nuevo"
         class="adm-nav-btn"
         routerLinkActive="adm-nav-btn--active"
         [routerLinkActiveOptions]="{exact:true}">
        <span class="adm-nav-btn__ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5"  y1="12" x2="19" y2="12"/>
          </svg>
        </span>
        <span class="adm-nav-btn__label">Nueva solicitud</span>
        <span class="adm-nav-btn__arrow" aria-hidden="true">›</span>
      </a>

      <a routerLink="/admin/tramites"
         class="adm-nav-btn"
         routerLinkActive="adm-nav-btn--active"
         [routerLinkActiveOptions]="{exact:true}">
        <span class="adm-nav-btn__ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3"  y1="9"  x2="21" y2="9"/>
            <line x1="9"  y1="21" x2="9"  y2="9"/>
          </svg>
        </span>
        <span class="adm-nav-btn__label">Solicitudes FUT</span>
        <span class="adm-nav-btn__arrow" aria-hidden="true">›</span>
      </a>

      <a routerLink="/admin/solicitantes"
         class="adm-nav-btn"
         routerLinkActive="adm-nav-btn--active"
         [routerLinkActiveOptions]="{exact:true}">
        <span class="adm-nav-btn__ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span class="adm-nav-btn__label">Solicitantes</span>
        <span class="adm-nav-btn__arrow" aria-hidden="true">›</span>
      </a>

      <a routerLink="/admin/tipo-tramite"
         class="adm-nav-btn"
         routerLinkActive="adm-nav-btn--active"
         [routerLinkActiveOptions]="{exact:true}">
        <span class="adm-nav-btn__ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </span>
        <span class="adm-nav-btn__label">Tipos de trámite</span>
        <span class="adm-nav-btn__arrow" aria-hidden="true">›</span>
      </a>

      <a routerLink="/admin/gestion-tramite"
         class="adm-nav-btn"
         routerLinkActive="adm-nav-btn--active"
         [routerLinkActiveOptions]="{exact:true}">
        <span class="adm-nav-btn__ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </span>
        <span class="adm-nav-btn__label">Gestión de Trámite FUT</span>
        <span class="adm-nav-btn__arrow" aria-hidden="true">›</span>
      </a>

      <hr class="adm-sidebar__divider" />

      <button class="adm-nav-btn adm-nav-btn--logout"
              type="button"
              (click)="logout()">
        <span class="adm-nav-btn__ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </span>
        <span class="adm-nav-btn__label">Cerrar sesión</span>
        <span class="adm-nav-btn__arrow" aria-hidden="true">›</span>
      </button>

    </nav>
  </aside>

  <!-- ════════════════ CONTENIDO (página hija) ════════════════ -->
  <div class="adm-page-content">
    <router-outlet />
  </div>

</div>
